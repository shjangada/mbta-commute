name: tick
# Cron is UTC and can start ~15 min late; `tick` converts to Boston time and tolerates that.
# Windows cover both EST and EDT: morning 10-14 UTC, evening 20-24 UTC, night plan 01-03 UTC (Tue-Sat = Mon-Fri evenings).
on:
  schedule:
    - cron: "*/15 10-13 * * 1-5"
    - cron: "*/15 20-23 * * 1-5"
    - cron: "*/15 1-3 * * 2-6"
  workflow_dispatch:

# Only this workflow writes state. Runs queue instead of overlapping.
concurrency:
  group: commute-state
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      COMMUTE_QUIET: "1"          # public repo: keep personal data out of logs
      TZ: America/New_York
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Write config
        env:
          CONFIG_TOML: ${{ secrets.CONFIG_TOML }}
        run: |
          printf '%s' "$CONFIG_TOML" > config.toml
          chmod 600 config.toml
      - name: Load state
        run: python -m commute state-load
      - name: Tick
        run: python -m commute tick
      - name: Save state
        if: always()
        run: python -m commute state-save
      - name: Commit state
        if: always()
        run: |
          git config user.name "commute-bot"
          git config user.email "commute-bot@users.noreply.github.com"
          git add state/state.enc
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "state" --quiet
          for i in 1 2 3; do git pull --rebase --quiet && git push --quiet && break; sleep 3; done
